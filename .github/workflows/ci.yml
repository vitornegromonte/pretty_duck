name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.46" pytest ruff
      - name: Tests (offline, CPU)
        run: python -m pytest -q
      - name: Lint (informational until the baseline is clean)
        run: ruff check src scripts tests --exit-zero
