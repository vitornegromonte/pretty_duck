[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pretty-duck"
version = "0.1.0"
description = "Domain-aware low-bit quantization of LLMs, with interpretability tests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers>=4.46",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
gpu = ["bitsandbytes"]  # only for the bnb_nf4 format

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["outputs", "graphify-out", ".cache", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
