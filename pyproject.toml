[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pretty-duck"
version = "0.1.0"
description = "Domain-aware low-bit quantization of LLMs, with interpretability tests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers>=4.46",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
gpu = ["bitsandbytes"]  # only for the bnb_nf4 format

[tool.setuptools]
# Flat layout for now. The plan moves the package to src/ (docs/reviews/advisor-2026-11/03_proposta_organizacao_repositorio.md).
packages = ["compress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["outputs", "graphify-out", ".cache", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
